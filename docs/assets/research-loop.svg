<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1080" viewBox="0 0 1200 1080" role="img" aria-labelledby="title desc">
<title id="title">EvoPolis: two linked research loops</title>
<desc id="desc">Proposed architecture. Human behavioral records are divided by participant and group into training, development and untouched test data. Evolution proposes memory and learning procedures; behavioral models are fitted on training data and judged on development prediction. Untouched test data are used only for final evaluation. In a separate loop, an ensemble of fitted behavioral models is frozen and combined with exact resource dynamics. Allocation policies are evolved against simulated welfare, inclusion and inequality. These are simulated hypotheses, not validated human outcomes. This diagram shows planned learning and evolution loops; the empirical foundation has been implemented.</desc>
