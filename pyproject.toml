[project]
name = "evopolis"
version = "0.1.0"
description = "Empirical common-pool experiment reconstruction"
requires-python = ">=3.10,<3.13"
dependencies = [
  "matplotlib==3.10.3",
  "numpy==2.2.6",
  "scipy==1.15.3",
  "torch==2.10.0+cpu",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
